<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬赏任务公会 - 悬浮窗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .float-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* 收起态悬浮条 */
    .float-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 360px;
      height: 72px;
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.85), rgba(22, 33, 62, 0.85));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      padding: 0 16px;
      cursor: move;
      opacity: 1;
      transform: translateY(0) scale(1);
      transform-origin: bottom center;
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 220ms ease, border-color 220ms ease;
      -webkit-app-region: drag;
    }

    .float-bar:hover {
      border-color: rgba(255, 215, 0, 0.5);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2);
    }

    body.expanded .float-bar {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    /* 图标区域 */
    .icon-area {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .icon-area svg {
      width: 24px;
      height: 24px;
      fill: #1a1a2e;
    }

    /* 任务信息 */
    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .timer {
      color: #ffd700;
      font-family: 'Consolas', monospace;
      font-weight: 600;
    }

    .mana-crystal {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mana-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .mana-dot.active {
      background: #9370db;
      box-shadow: 0 0 6px #9370db;
    }

    /* 操作按钮 */
    .action-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .action-btn:hover {
      background: rgba(255, 215, 0, 0.2);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: rgba(255, 255, 255, 0.8);
    }

    /* 展开面板 */
    .expanded-panel {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 360px;
      height: 500px;
      background: linear-gradient(180deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 215, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(18px) scale(0.985);
      transform-origin: bottom center;
      transition: opacity 180ms ease, transform 240ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 240ms;
    }

    body.expanded .expanded-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity 180ms ease 30ms, transform 240ms cubic-bezier(0.22, 1, 0.36, 1) 30ms, visibility 0s linear 0s;
    }

    /* 面板头部 */
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }

    .panel-title {
      font-size: 14px;
      color: #ffd700;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .panel-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .panel-btn:hover {
      background: rgba(255, 215, 0, 0.2);
    }

    .panel-btn svg {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.7);
    }

    /* 追踪任务卡片 */
    .tracking-card {
      margin: 12px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(147, 112, 219, 0.15), rgba(255, 215, 0, 0.1));
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 10px;
    }

    .tracking-label {
      font-size: 11px;
      color: #9370db;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .tracking-task-name {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .boss-progress {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .boss-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd700);
      border-radius: 3px;
      width: 45%;
      transition: width 0.3s ease;
    }

    .tracking-timer {
      font-size: 28px;
      color: #ffd700;
      font-family: 'Consolas', monospace;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .tracking-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .btn-start {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #fff;
    }

    .btn-start:hover {
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }

    .btn-pause {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #fff;
    }

    .btn-complete {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      color: #fff;
    }

    /* 注意力任务列表 */
    .attention-section {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px;
    }

    .section-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title span {
      color: #9370db;
    }

    .attention-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .attention-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .attention-item:hover {
      background: rgba(255, 215, 0, 0.1);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .attention-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      margin-right: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .attention-item.completed .attention-checkbox {
      background: #4ade80;
      border-color: #4ade80;
    }

    .attention-item.completed .attention-checkbox::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    .attention-item.completed .attention-text {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.4);
    }

    .attention-text {
      flex: 1;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attention-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-left: 8px;
    }

    /* 底部快捷栏 */
    .quick-bar {
      padding: 12px;
      border-top: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      gap: 8px;
    }

    .quick-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .quick-btn:hover {
      background: rgba(255, 215, 0, 0.15);
    }

    .quick-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffd700;
    }

    .quick-btn span {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.3);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="float-shell">
  <!-- 收起态悬浮条 -->
  <div class="float-bar" id="floatBar">
    <div class="icon-area">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
      </svg>
    </div>
    <div class="task-info">
      <div class="task-name" id="taskName">学习 Python 数据分析</div>
      <div class="task-meta">
        <span class="timer" id="timer">00:45:30</span>
        <div class="mana-crystal">
          <div class="mana-dot active"></div>
          <div class="mana-dot active"></div>
          <div class="mana-dot active"></div>
          <div class="mana-dot"></div>
          <div class="mana-dot"></div>
        </div>
      </div>
    </div>
    <button class="action-btn" id="expandBtn" title="展开">
      <svg viewBox="0 0 24 24">
        <path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/>
      </svg>
    </button>
  </div>

  <!-- 展开面板 -->
  <div class="expanded-panel" id="expandedPanel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffd700">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
        今日悬赏
      </div>
      <div class="panel-actions">
        <button class="panel-btn" id="collapseBtn" title="收起">
          <svg viewBox="0 0 24 24">
            <path d="M7.41 15.41L12 10.83L16.59 15.41L18 14L12 8L6 14L7.41 15.41Z"/>
          </svg>
        </button>
        <button class="panel-btn" id="openMainBtn" title="打开主界面">
          <svg viewBox="0 0 24 24">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19Z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 追踪任务卡片 -->
    <div class="tracking-card">
      <div class="tracking-label">⚔️ 追踪任务</div>
      <div class="tracking-task-name">完成数据分析项目报告</div>
      <div class="boss-progress">
        <div class="boss-progress-bar" style="width: 65%"></div>
      </div>
      <div class="tracking-timer" id="panelTimer">00:45:30</div>
      <div class="tracking-controls">
        <button class="control-btn btn-start" id="startBtn">开始专注</button>
        <button class="control-btn btn-complete">完成</button>
      </div>
    </div>

    <!-- 注意力任务列表 -->
    <div class="attention-section">
      <div class="section-title">
        注意力任务
        <span>2/5</span>
      </div>
      <div class="attention-list">
        <div class="attention-item completed">
          <div class="attention-checkbox"></div>
          <span class="attention-text">整理项目需求文档</span>
          <span class="attention-time">30min</span>
        </div>
        <div class="attention-item completed">
          <div class="attention-checkbox"></div>
          <span class="attention-text">回复邮件</span>
          <span class="attention-time">15min</span>
        </div>
        <div class="attention-item">
          <div class="attention-checkbox"></div>
          <span class="attention-text">学习 Pandas 高级用法</span>
          <span class="attention-time">45min</span>
        </div>
        <div class="attention-item">
          <div class="attention-checkbox"></div>
          <span class="attention-text">代码审查</span>
          <span class="attention-time">20min</span>
        </div>
        <div class="attention-item">
          <div class="attention-checkbox"></div>
          <span class="attention-text">准备周会材料</span>
          <span class="attention-time">25min</span>
        </div>
      </div>
    </div>

    <!-- 底部快捷栏 -->
    <div class="quick-bar">
      <button class="quick-btn">
        <svg viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        <span>快速悬赏</span>
      </button>
      <button class="quick-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
        <span>技能树</span>
      </button>
      <button class="quick-btn">
        <svg viewBox="0 0 24 24">
          <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <span>公会商店</span>
      </button>
    </div>
  </div>
  </div>

  <script>
    // DOM 元素
    const body = document.body;
    const floatBar = document.getElementById('floatBar');
    const expandedPanel = document.getElementById('expandedPanel');
    const expandBtn = document.getElementById('expandBtn');
    const collapseBtn = document.getElementById('collapseBtn');
    const openMainBtn = document.getElementById('openMainBtn');
    const startBtn = document.getElementById('startBtn');

    // 状态
    let isExpanded = false;
    let isRunning = false;
    let seconds = 2730; // 45分30秒
    let timerInterval = null;
    let expandTimer = null;
    let collapseTimer = null;
    let transitionTimer = null;
    let windowSyncTimer = null;

    const EXPAND_DELAY = 180;
    const COLLAPSE_DELAY = 260;
    const WINDOW_EXPAND_DELAY = 28;
    const WINDOW_COLLAPSE_DELAY = 150;
    const PANEL_TRANSITION_DURATION = 260;

    // 格式化时间
    function formatTime(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // 更新计时器显示
    function updateTimer() {
      const timeStr = formatTime(seconds);
      document.getElementById('timer').textContent = timeStr;
      document.getElementById('panelTimer').textContent = timeStr;
    }

    function clearExpandTimer() {
      if (expandTimer) {
        clearTimeout(expandTimer);
        expandTimer = null;
      }
    }

    function clearCollapseTimer() {
      if (collapseTimer) {
        clearTimeout(collapseTimer);
        collapseTimer = null;
      }
    }

    function clearTransitionTimers() {
      if (transitionTimer) {
        clearTimeout(transitionTimer);
        transitionTimer = null;
      }
      if (windowSyncTimer) {
        clearTimeout(windowSyncTimer);
        windowSyncTimer = null;
      }
    }

    // 开始/暂停计时
    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = '继续';
        startBtn.className = 'control-btn btn-start';
      } else {
        timerInterval = setInterval(() => {
          seconds++;
          updateTimer();
        }, 1000);
        startBtn.textContent = '暂停';
        startBtn.className = 'control-btn btn-pause';
      }
      isRunning = !isRunning;
    }

    // 展开面板
    function expandPanel() {
      clearExpandTimer();
      clearCollapseTimer();
      clearTransitionTimers();
      if (isExpanded) return;

      isExpanded = true;
      body.classList.add('animating');

      if (window.electronAPI) {
        window.electronAPI.window.expandFloat();
      }

      windowSyncTimer = setTimeout(() => {
        body.classList.add('expanded');
      }, WINDOW_EXPAND_DELAY);

      transitionTimer = setTimeout(() => {
        body.classList.remove('animating');
      }, PANEL_TRANSITION_DURATION);
    }

    // 收起面板
    function collapsePanel() {
      clearExpandTimer();
      clearCollapseTimer();
      clearTransitionTimers();
      if (!isExpanded) return;

      isExpanded = false;
      body.classList.add('animating');
      body.classList.remove('expanded');

      windowSyncTimer = setTimeout(() => {
        if (window.electronAPI) {
          window.electronAPI.window.collapseFloat();
        }
      }, WINDOW_COLLAPSE_DELAY);

      transitionTimer = setTimeout(() => {
        body.classList.remove('animating');
      }, WINDOW_COLLAPSE_DELAY + 120);
    }

    // 打开主界面
    function openMainWindow() {
      if (window.electronAPI) {
        window.electronAPI.window.showMain();
      }
    }

    function scheduleExpand() {
      clearCollapseTimer();
      if (isExpanded) return;

      clearExpandTimer();
      expandTimer = setTimeout(() => {
        if (!isExpanded && floatBar.matches(':hover')) {
          expandPanel();
        }
      }, EXPAND_DELAY);
    }

    function scheduleCollapse() {
      clearExpandTimer();
      if (!isExpanded) return;

      clearCollapseTimer();
      collapseTimer = setTimeout(() => {
        if (isExpanded && !expandedPanel.matches(':hover')) {
          collapsePanel();
        }
      }, COLLAPSE_DELAY);
    }

    // 注意力任务点击完成
    document.querySelectorAll('.attention-item').forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('completed');
      });
    });

    // 事件监听
    expandBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      expandPanel();
    });

    collapseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      collapsePanel();
    });

    openMainBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openMainWindow();
    });

    startBtn.addEventListener('click', toggleTimer);

    // 悬浮条悬停展开
    floatBar.addEventListener('mouseenter', scheduleExpand);
    floatBar.addEventListener('mouseleave', clearExpandTimer);

    expandedPanel.addEventListener('mouseenter', clearCollapseTimer);

    // 面板移出收起
    expandedPanel.addEventListener('mouseleave', scheduleCollapse);
    document.addEventListener('mouseleave', scheduleCollapse);
    window.addEventListener('blur', scheduleCollapse);

    // 初始化
    updateTimer();
  </script>
</body>
</html>
